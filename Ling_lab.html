<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark">
<meta name="theme-color" content="#0b0909">
<title>LingPlus · English Mission</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
/* ===== LingPlus design tokens (sampled from the LingPlus site) ===== */
*{box-sizing:border-box}
:root{
  --black:#0b0909;
  --ink:#12142e;
  --muted:#5d6180;
  --line:#e1e4f2;
  --soft:#f3f5fc;
  --blue:#0067e3;        /* LingPlus button / logo plus */
  --blue-d:#0050b3;
  --indigo:#1821c6;
  --pink:#d971a9;        /* hero gradient */
  --hot:#ff3d81;
  --red:#e81224;
  --orange:#f7630c;
  --gold:#f2b138;
  --green:#12b76a;
  --bad:#ef3b5c;
  --font:'Inter',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
[hidden]{display:none!important}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;height:100%;overflow:hidden;background:var(--black);color:#fff;font-family:var(--font);font-size:26px;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
textarea,input{user-select:text;-webkit-user-select:text}
:focus-visible{outline:3px solid var(--gold);outline-offset:3px}
#app{position:relative;height:100%}
#fit{position:absolute;inset:0;overflow:hidden}
#frame{position:absolute;left:0;top:0;width:1920px;height:1080px;transform-origin:0 0;display:flex;flex-direction:column;overflow:hidden;
  background:
   radial-gradient(1000px 760px at 108% 12%,rgba(217,113,169,.62),rgba(217,113,169,0) 62%),
   radial-gradient(880px 620px at 74% 108%,rgba(232,18,36,.30),rgba(232,18,36,0) 62%),
   radial-gradient(900px 700px at -6% 112%,rgba(0,103,227,.40),rgba(0,103,227,0) 62%),
   var(--black)}
#fx{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:60}

/* ---- header (like the LingPlus top menu) ---- */
#bar{flex:none;height:84px;display:flex;align-items:center;gap:14px;padding:0 30px;border-bottom:1px solid rgba(255,255,255,.14);position:relative;z-index:20}
.brand{display:flex;align-items:center;gap:10px;font:900 38px/1 var(--font);letter-spacing:-.03em;white-space:nowrap}
.brand svg{width:62px;height:46px;flex:none}
#nav{display:flex;gap:6px;margin-left:12px}
.step{white-space:nowrap;font:700 19px var(--font);color:rgba(255,255,255,.78);background:transparent;border:2px solid rgba(255,255,255,.22);border-radius:999px;padding:9px 15px;cursor:pointer;transition:background .2s}
.step.on{background:var(--blue);border-color:var(--blue);color:#fff;box-shadow:0 6px 20px rgba(0,103,227,.5)}
.step:disabled{opacity:.35;cursor:default}
#score{display:flex;gap:6px;margin-left:auto}
.chip{white-space:nowrap;display:inline-flex;align-items:center;gap:6px;padding:4px 12px;border-radius:999px;background:rgba(255,255,255,.1);border:2px solid var(--c,rgba(255,255,255,.25));font-weight:800;font-size:20px;color:#fff}
.react{display:flex;align-items:center;gap:10px;margin-left:8px;white-space:nowrap}
.rbs{display:flex}
.rb{width:38px;height:38px;border-radius:50%;border:3px solid var(--black);display:grid;place-items:center;font-size:18px;cursor:pointer;margin-left:-9px;transition:transform .12s}
.rb:first-child{margin-left:0}
.rb:active{transform:scale(1.35)}
.rb.r1{background:var(--blue)}.rb.r2{background:var(--red)}.rb.r3{background:var(--orange)}
.react span{font:600 18px var(--font);color:rgba(255,255,255,.8)}
.react b{font-weight:800;color:#fff}
.tools{display:flex;gap:8px;margin-left:6px}
.icon{flex:none;width:46px;height:46px;border-radius:50%;border:2px solid rgba(255,255,255,.25);background:rgba(255,255,255,.08);color:#fff;font-size:20px;cursor:pointer}
.audpop{position:absolute;right:30px;top:90px;z-index:45;width:460px;background:#fff;color:var(--ink);border-radius:22px;padding:18px 22px;box-shadow:0 24px 60px rgba(0,0,0,.5);display:grid;gap:14px}
.arow{display:grid;grid-template-columns:190px 1fr;gap:16px;align-items:center}
.tg{font:800 20px var(--font);border:2px solid var(--line);background:var(--soft);color:var(--muted);border-radius:12px;padding:10px 14px;cursor:pointer;text-align:left}
.tg.on{background:var(--blue);border-color:var(--blue);color:#fff}
.rng{width:100%;accent-color:var(--blue);height:26px}
.floaty{position:absolute;z-index:55;font-size:56px;pointer-events:none;animation:floatUp 1.7s ease-out forwards}
@keyframes floatUp{0%{transform:translateY(0) scale(.5);opacity:0}15%{opacity:1;transform:translateY(-30px) scale(1.2)}100%{transform:translateY(-300px) scale(1);opacity:0}}

/* ---- stage + shared ---- */
#stage{flex:1;min-height:0;overflow:auto;padding:24px 40px 28px;display:flex;flex-direction:column;position:relative}
.wrap{width:100%;margin-block:auto}
.panel{background:#fff;color:var(--ink);border-radius:28px;padding:32px 40px;box-shadow:0 24px 60px rgba(0,0,0,.4)}
.h1{font:900 66px/1 var(--font);letter-spacing:-.035em;text-transform:uppercase;text-align:center;margin:0 0 10px}
.panel .h1{color:var(--ink)}
.h1 em{font-style:normal;color:var(--hot)}
.sub{color:rgba(255,255,255,.78);font-weight:500;font-size:28px;text-align:center;margin:6px 0 20px}
.panel .sub{color:var(--muted)}
.actions{display:flex;gap:16px;flex-wrap:wrap;justify-content:center;margin-top:24px}
.btn{font:800 26px/1 var(--font);letter-spacing:.04em;text-transform:uppercase;border:0;border-radius:12px;padding:24px 44px;min-height:74px;background:var(--blue);color:#fff;cursor:pointer;box-shadow:0 10px 28px rgba(0,103,227,.5);transition:transform .08s,box-shadow .08s,background .2s}
.btn:hover{background:#1a7bff}
.btn:active{transform:translateY(4px);box-shadow:0 2px 8px rgba(0,103,227,.5)}
.btn.ok{background:var(--green);box-shadow:0 10px 28px rgba(18,183,106,.45)}
.btn.ghost{background:rgba(255,255,255,.1);border:2px solid rgba(255,255,255,.3);box-shadow:none;color:#fff}
.panel .btn.ghost{background:var(--soft);border-color:var(--line);color:var(--ink)}
.btn.sm{font-size:20px;padding:15px 28px;min-height:56px}
.btn:disabled{opacity:.4;cursor:default;box-shadow:none}
.err{color:var(--bad);font-weight:700;min-height:1.3em;text-align:center;margin:12px 0 0;font-size:22px}
.out{color:transparent;-webkit-text-stroke:3px #fff;font-weight:900;letter-spacing:-.02em}
.panel .out{-webkit-text-stroke-color:var(--blue)}
@keyframes shake{25%{transform:translateX(-9px)}75%{transform:translateX(9px)}}
@keyframes pop{0%{transform:scale(.2);opacity:0}70%{transform:scale(1.15)}100%{transform:scale(1);opacity:1}}
.shake{animation:shake .4s}
.cd{position:absolute;inset:0;z-index:50;display:grid;place-items:center;background:rgba(11,9,9,.72);backdrop-filter:blur(4px)}
.cd b{font:900 420px/1 var(--font);animation:pop .55s both}
.ready{min-height:46px;margin-top:10px;text-align:center;font:800 30px var(--font);color:var(--gold)}

/* ---- setup (teacher view, Russian) ---- */
#setup{font-size:22px}
#setup .h1{font-size:46px}
#setup .sub{font-size:24px;margin-bottom:10px}
.cols{display:grid;grid-template-columns:1.15fr 1fr;gap:32px}
label{display:block;font-weight:700;margin-top:12px;font-size:21px}
label>input,label>textarea{margin-top:6px}
textarea,input[type=text],input[type=number],input:not([type]){width:100%;background:var(--soft);border:2px solid var(--line);border-radius:14px;color:var(--ink);font:600 20px/1.4 var(--font);padding:12px 14px}
textarea{resize:vertical}
.help{color:var(--muted);font-size:18px;line-height:1.4;margin:6px 2px 0;font-weight:500}
.nums{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.gen{background:linear-gradient(120deg,#eaf2ff,#fde9f3);border:2px dashed var(--blue);border-radius:20px;padding:14px 18px;margin-bottom:10px}
.gen .row2{display:grid;grid-template-columns:2fr 1fr auto;gap:12px;align-items:end}
.gen .btn{min-height:56px;padding:14px 24px;font-size:18px}
#gennote{font-size:18px;color:var(--muted);font-weight:600;margin:8px 0 0}

/* ---- teams: scratch cards ---- */
.cards{display:grid;gap:14px;width:100%;margin-top:6px}
.card{position:relative;height:var(--rh);border-radius:22px;overflow:hidden;background:#1a1a24;border:3px solid rgba(255,255,255,.35)}
.card .under{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;font-weight:900;opacity:0;color:var(--ink)}
.card.peek .under,.card.done .under{opacity:1;background:var(--c)}
.card.done{border-color:#fff;box-shadow:0 0 30px color-mix(in srgb,var(--c) 70%,transparent)}
.under b{font-size:min(76px,calc(var(--rh) * .42));line-height:1.1}
.under span{font-size:min(28px,calc(var(--rh) * .16));text-transform:uppercase;letter-spacing:.06em}
.scratch{position:absolute;inset:0;width:100%;height:100%;touch-action:none;cursor:grab;transition:opacity .5s}
.card.done .scratch{opacity:0;pointer-events:none}
.counts{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:14px;min-height:50px}

/* ---- escape room ---- */
.escwrap{display:flex;flex-direction:column;gap:14px;height:100%}
.track{flex:none;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.2);border-radius:22px;padding:10px 22px;display:flex;gap:24px;align-items:center;backdrop-filter:blur(6px)}
.lanes{flex:1;display:grid;gap:2px}
.lane{display:flex;align-items:center;gap:10px;height:var(--lh,32px)}
.lane .ln{width:38px;font-size:calc(var(--lh,32px) * .75);line-height:1;text-align:center}
.rail{position:relative;flex:1;height:10px;border-radius:99px;background:rgba(255,255,255,.2)}
.rail i{position:absolute;left:0;top:0;bottom:0;border-radius:99px;background:linear-gradient(90deg,var(--blue),var(--pink));transition:width .7s cubic-bezier(.3,1.4,.5,1)}
.runner{position:absolute;top:50%;transform:translate(-50%,-50%);font-size:calc(var(--lh,32px) * .9);line-height:1;transition:left .7s cubic-bezier(.3,1.4,.5,1)}
.goal{position:absolute;right:-8px;top:50%;transform:translateY(-50%);font-size:calc(var(--lh,32px) * .9);line-height:1}
.medal{width:34px;font-size:24px;text-align:center}
.tbox{text-align:center;min-width:210px}
.tbox .tl{font-weight:700;font-size:17px;color:rgba(255,255,255,.65);letter-spacing:.1em}
#timer{font:900 50px/1 var(--font);letter-spacing:-.02em}
#timer.low{color:#ff5a6e;animation:pulse 1s infinite}
@keyframes pulse{50%{transform:scale(1.08)}}
.quads{flex:1;min-height:0;display:grid;gap:14px}
.quads.g2{grid-template-columns:1fr 1fr}
.quads.g3{grid-template-columns:repeat(3,1fr)}
.quads.g4{grid-template-columns:1fr 1fr;grid-template-rows:1fr 1fr}
.quads.g5,.quads.g6{grid-template-columns:repeat(3,1fr);grid-template-rows:1fr 1fr}
.quad{position:relative;display:flex;flex-direction:column;min-height:0;background:#fff;color:var(--ink);border-radius:26px;overflow:hidden;box-shadow:0 0 0 4px var(--c),0 18px 44px rgba(0,0,0,.4)}
.qhead{display:flex;align-items:center;gap:12px;padding:8px 18px;background:var(--c);color:var(--ink);font-weight:900;font-size:28px;letter-spacing:-.01em}
.qhead .grow{flex:1}
.qprog{font-size:19px;font-weight:700;opacity:.8}
.fz{font:800 17px var(--font);letter-spacing:.04em;text-transform:uppercase;border:0;border-radius:99px;padding:8px 14px;background:var(--ink);color:#fff;cursor:pointer}
.fz:disabled{opacity:.35;cursor:default}
.strip{display:flex;gap:5px;padding:9px 16px 0}
.cell{flex:1;height:32px;border-radius:9px;background:var(--soft);border:2px solid var(--line);display:grid;place-items:center;font:800 19px var(--font);color:var(--muted)}
.cell.f{background:var(--blue);border-color:var(--blue);color:#fff}
.qbody{flex:1;min-height:0;padding:10px 18px 14px;display:flex;flex-direction:column;gap:10px;overflow:hidden}
.qlabel{font-weight:700;color:var(--blue);font-size:19px;text-transform:uppercase;letter-spacing:.06em}
.qmain{font-weight:800;line-height:1.2;text-align:center;margin:auto 0;letter-spacing:-.01em}
.qmain.sm{font-size:40px}.qmain.md{font-size:33px}.qmain.lg{font-size:28px}.qmain.xl{font-size:24px}
.qmain.emoji{font-size:100px}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.opt{font:700 27px/1.15 var(--font);padding:12px;min-height:84px;border:3px solid var(--line);border-radius:16px;background:var(--soft);color:var(--ink);cursor:pointer;transition:background .15s,border-color .15s}
.opt:active{background:#e5efff;border-color:var(--blue)}
.opt.long{font-size:22px}
.dense .qhead{font-size:24px;padding:6px 12px}
.dense .qmain.sm{font-size:30px}.dense .qmain.md{font-size:26px}.dense .qmain.lg{font-size:22px}.dense .qmain.xl{font-size:20px}
.dense .qmain.emoji{font-size:70px}
.dense .opt{font-size:22px;min-height:62px;padding:8px}.dense .opt.long{font-size:19px}
.dense .cell{height:26px;font-size:16px}
.dense .qlabel{font-size:16px}
.bslots,.btiles{display:flex;gap:8px;justify-content:center;flex-wrap:wrap}
.slot,.tile{width:54px;height:64px;border-radius:12px;font:800 32px var(--font);cursor:pointer;text-transform:uppercase}
.slot{border:3px dashed #c5cbe2;background:var(--soft);color:var(--ink)}
.slot.f{border-style:solid;border-color:var(--blue);background:#e5efff}
.tile{border:0;background:var(--blue);color:#fff;box-shadow:0 5px 0 var(--blue-d)}
.tile:disabled{opacity:.2;box-shadow:none;cursor:default}
.dense .slot,.dense .tile{width:42px;height:50px;font-size:26px}
.locked{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;animation:pop .4s both;text-align:center}
.locked .lk{font-weight:900;font-size:32px}
.locked .dgl{color:var(--muted);font-weight:600;font-size:22px}
.locked .dgn{font:900 130px/1 var(--font);color:var(--blue)}
.dense .locked .dgn{font-size:84px}
.qfreeze{position:absolute;inset:0;background:rgba(0,80,179,.93);color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;font:800 34px var(--font);z-index:3;text-align:center;padding:20px}
.qfreeze b{font-size:120px;line-height:1}
.qpick{position:absolute;right:12px;top:64px;z-index:4;background:#fff;border:3px solid var(--ink);border-radius:18px;padding:10px 14px;display:flex;gap:10px;align-items:center;font-weight:800;font-size:20px;box-shadow:0 12px 30px rgba(0,0,0,.35)}
.pk{font-size:34px;background:color-mix(in srgb,var(--c) 22%,#fff);border:3px solid var(--c);border-radius:14px;padding:4px 12px;cursor:pointer}
.mini{border:0;background:transparent;font-size:22px;cursor:pointer;color:var(--muted)}
.intro{max-width:1560px;margin-inline:auto}
.rules{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin:18px 0 4px;font-size:25px;font-weight:600}
.rules div{background:var(--soft);border:2px solid var(--line);border-radius:18px;padding:16px 22px;line-height:1.3}
.order{display:grid;gap:10px;max-width:900px;margin:10px auto}
.orow{display:flex;align-items:center;gap:16px;background:color-mix(in srgb,var(--c) 14%,#fff);border:3px solid var(--c);border-radius:18px;padding:12px 22px;font-weight:800;font-size:30px}
.orow .grow{flex:1}

/* ---- doors ---- */
.doorstage{display:flex;flex-direction:column;align-items:center;gap:12px;min-height:100%}
.dtitle{font:900 54px/1 var(--font);letter-spacing:-.03em;text-transform:uppercase;display:flex;gap:18px;align-items:baseline}
.dtitle small{font:600 24px var(--font);color:rgba(255,255,255,.7);text-transform:none;letter-spacing:0}
.scene{position:relative;width:1560px;height:400px;flex:none;background:linear-gradient(#1b1b27 0 72%,#0f0f16 72%);border:2px solid rgba(255,255,255,.18);border-radius:30px;overflow:hidden;transition:background .3s}
.scene.flash{background:linear-gradient(#5a1020 0 72%,#2a0810 72%)}
.walker{position:absolute;bottom:42px;left:50px;font-size:150px;line-height:1;transition:left 1.9s cubic-bezier(.4,0,.2,1)}
.walker.go{left:900px}
.walker.hop{animation:hop .26s infinite}
@keyframes hop{50%{transform:translateY(-14px)}}
.bigdoor{position:absolute;right:140px;bottom:28px;width:310px;height:350px;border-radius:26px 26px 6px 6px;overflow:hidden;background:#06122b;border:8px solid #2b7fff}
.bigdoor .half{position:absolute;top:0;bottom:0;width:50%;background:linear-gradient(160deg,#0a58c9,#073b8c);transition:transform 1.2s cubic-bezier(.7,0,.2,1)}
.bigdoor .l{left:0;border-right:3px solid #03234f}
.bigdoor .r{right:0;border-left:3px solid #03234f}
.bigdoor .lk{position:absolute;inset:0;z-index:2;display:grid;place-items:center;font-size:90px;transition:opacity .4s}
.bigdoor .loot{position:absolute;inset:0;display:grid;place-items:center;font-size:150px;transform:scale(.3);opacity:0;transition:transform .9s .5s,opacity .9s .5s}
.bigdoor.open{box-shadow:0 0 90px rgba(242,177,56,.75)}
.bigdoor.open .l{transform:translateX(-101%)}
.bigdoor.open .r{transform:translateX(101%)}
.bigdoor.open .lk{opacity:0}
.bigdoor.open .loot{transform:scale(1);opacity:1}
.bigdoor.alarm{animation:shake .4s 3;border-color:var(--bad)}
.codes{display:flex;gap:10px;justify-content:center}
.ccell{width:124px;height:132px;border-radius:20px;background:rgba(255,255,255,.08);border:3px solid rgba(255,255,255,.25);display:grid;place-items:center;font:900 76px var(--font)}
.ccell.typed{border-color:var(--blue);background:rgba(0,103,227,.3)}
.ccell.ok{background:rgba(18,183,106,.28);border-color:var(--green);color:#7dffc3}
.ccell.bad{background:rgba(239,59,92,.3);border-color:var(--bad);color:#ff9bb0;animation:shake .4s}
.verdict{font:900 46px/1.1 var(--font);letter-spacing:-.02em;text-align:center;min-height:52px}
.verdict.win{color:#7dffc3}
.verdict.lose{color:#ff9bb0}
.review{width:1560px;max-height:190px;overflow:auto;display:grid;grid-template-columns:1fr 1fr;gap:10px}
.rv{background:#fff;color:var(--ink);border-radius:14px;padding:10px 16px;font-size:21px;text-align:left;font-weight:500}
.rv b{color:var(--green)}
.rtab{width:100%;max-width:1300px;margin:10px auto;border-collapse:separate;border-spacing:0 10px}
.rtab td{background:color-mix(in srgb,var(--c) 14%,#fff);padding:14px 20px;font-weight:800;font-size:28px;border-top:3px solid var(--c);border-bottom:3px solid var(--c)}
.rtab td:first-child{border-left:3px solid var(--c);border-radius:18px 0 0 18px}
.rtab td:last-child{border-right:3px solid var(--c);border-radius:0 18px 18px 0;text-align:right}

/* ---- match ---- */
.matchwrap{position:relative;display:flex;flex-direction:column;gap:14px;height:100%}
.turn{flex:none;display:flex;align-items:center;gap:24px;background:rgba(255,255,255,.1);border:3px solid var(--c);border-radius:22px;padding:10px 24px;backdrop-filter:blur(6px)}
.turn .who{font:900 40px/1 var(--font);letter-spacing:-.02em;text-transform:uppercase}
.turn .msg{font-weight:600;font-size:22px;color:rgba(255,255,255,.75)}
.turn .tbar{width:260px;height:14px;border-radius:99px;background:rgba(255,255,255,.2);overflow:hidden}
.turn .tbar i{display:block;height:100%;width:100%;background:var(--c);transition:width .2s linear}
.turn .mscore{display:flex;gap:8px;margin-left:auto}
.mcols{flex:1;min-height:0;display:grid;grid-template-columns:1fr 1.6fr;gap:80px}
.mcol{display:grid;grid-auto-rows:1fr;gap:10px;min-height:0}
.mt{font:800 30px/1.15 var(--font);border:3px solid transparent;border-radius:16px;background:#fff;color:var(--ink);padding:6px 18px;cursor:pointer;text-align:left;display:flex;align-items:center;gap:12px;touch-action:none;transition:transform .12s,border-color .12s}
.mt.h{font-weight:600;font-size:24px}
.mt.emo{font-size:44px;justify-content:center}
.mt.sel{border-color:var(--blue);background:#e5efff;transform:scale(1.02)}
.mt.hov{border-color:var(--hot);background:#ffe9f2;transform:scale(1.03)}
.mt.dragsrc{opacity:.35}
.mt.got{background:var(--c);cursor:default;opacity:.95}
.mt.bad{animation:shake .4s;border-color:var(--bad);background:#ffe0e7}
.dragghost{position:fixed;z-index:70;pointer-events:none;font:800 30px var(--font);background:var(--blue);color:#fff;border-radius:16px;padding:12px 20px;box-shadow:0 18px 40px rgba(0,0,0,.5);transform-origin:center}
.mline{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;overflow:visible}
.mline line{stroke-width:8;stroke-linecap:round;stroke-dasharray:2000;stroke-dashoffset:2000;animation:draw .5s forwards,fade .5s .7s forwards}
@keyframes draw{to{stroke-dashoffset:0}}
@keyframes fade{to{opacity:0}}

/* ---- smash ---- */
.pickrow{display:flex;gap:14px;flex-wrap:wrap;justify-content:center;margin:10px 0 22px}
.pickteam{display:flex;flex-direction:column;align-items:center;gap:2px;font:900 54px var(--font);padding:14px 30px;border-radius:22px;border:4px solid var(--line);background:var(--soft);color:var(--ink);cursor:pointer}
.pickteam span{font-size:22px;font-weight:800;text-transform:uppercase;letter-spacing:.05em}
.pickteam.on{border-color:var(--c);background:color-mix(in srgb,var(--c) 28%,#fff)}
.pickhead{text-align:center;font-weight:800;font-size:24px;color:var(--muted);text-transform:uppercase;letter-spacing:.08em}
.smashwrap{display:flex;flex-direction:column;gap:14px;height:100%}
.hintcard{flex:none;text-align:center;position:relative;padding:14px 30px 20px}
.round{color:var(--muted);font-weight:700;font-size:20px;text-transform:uppercase;letter-spacing:.08em}
.rtimer{height:10px;border-radius:99px;background:var(--line);overflow:hidden;margin:6px auto 0;width:60%}
.rtimer i{display:block;height:100%;width:100%;background:linear-gradient(90deg,var(--blue),var(--hot));transition:width .2s linear}
.hint{font:800 56px/1.15 var(--font);letter-spacing:-.02em;margin:4px 0}
.hint.long{font-size:38px}
.hint.emoji{font-size:110px;line-height:1.05}
.flash{min-height:1.3em;font:900 34px var(--font);color:var(--hot)}
.speak{position:absolute;right:20px;top:16px;width:56px;height:56px;border-radius:50%;border:2px solid var(--line);background:#fff;font-size:24px;cursor:pointer}
.sides{flex:1;min-height:0;display:grid;grid-template-columns:1fr 1fr;gap:24px}
.sides.shk{animation:shake .35s}
.side{position:relative;display:flex;flex-direction:column;border-radius:28px;border:5px solid var(--c);background:rgba(255,255,255,.08);padding:12px 16px;min-height:0;backdrop-filter:blur(6px)}
.side.locked::after{content:'⛔ wait…';position:absolute;inset:0;border-radius:22px;background:rgba(11,9,9,.82);color:#fff;display:grid;place-items:center;font:900 44px var(--font);z-index:2}
.sidehead{display:flex;justify-content:space-between;align-items:center;font-weight:800;font-size:30px;margin:0 6px 8px}
.sidehead b{font:900 54px/1 var(--font);color:var(--c)}
.rocks{flex:1;min-height:0;display:grid;grid-template-columns:repeat(2,1fr);grid-auto-rows:1fr;gap:12px}
.meteor{padding:6px 10px;font:800 32px/1.1 var(--font);color:var(--ink);background:#fff;border:4px solid transparent;cursor:pointer;animation:bob 3s ease-in-out infinite;animation-delay:var(--d);word-break:break-word;box-shadow:0 8px 20px rgba(0,0,0,.3)}
.meteor.r0{border-radius:38% 62% 55% 45%/55% 40% 60% 45%}
.meteor.r1{border-radius:60% 40% 45% 55%/45% 58% 42% 55%}
.meteor.r2{border-radius:45% 55% 62% 38%/60% 45% 55% 40%}
.meteor.r3{border-radius:55% 45% 40% 60%/42% 60% 40% 58%}
@keyframes bob{50%{transform:translateY(-6px) rotate(1.5deg)}}
.meteor.bad{background:#ffe0e7;border-color:var(--bad);animation:shake .4s;cursor:default}
.meteor.reveal{background:#d9f7e8;border-color:var(--green);animation:pulse .6s infinite}
.meteor.boom{background:var(--gold);animation:boom .6s forwards}
@keyframes boom{0%{transform:scale(1)}40%{transform:scale(1.3) rotate(6deg)}100%{transform:scale(0);opacity:0}}
.score{font:900 170px/1 var(--font);text-align:center;margin:10px 0}

/* ---- reflect ---- */
.balloons{display:grid;grid-template-columns:repeat(5,1fr);gap:50px 24px;justify-items:center;margin-top:16px;padding-bottom:40px}
.balloon{position:relative;width:170px;height:210px;border:0;border-radius:50% 50% 50% 50%/58% 58% 42% 42%;background:var(--c);color:rgba(255,255,255,.95);font:900 64px var(--font);cursor:pointer;animation:float 3.2s ease-in-out infinite;animation-delay:var(--d);box-shadow:inset -12px -14px 0 rgba(0,0,0,.14),inset 12px 12px 0 rgba(255,255,255,.25)}
.balloon::after{content:'';position:absolute;left:50%;bottom:-10px;width:16px;height:16px;background:var(--c);transform:translateX(-50%) rotate(45deg);border-radius:3px}
.balloon::before{content:'';position:absolute;left:50%;top:100%;width:3px;height:40px;background:rgba(255,255,255,.4)}
.balloon.gone{animation:none;transform:scale(0);opacity:0;transition:transform .25s,opacity .25s;pointer-events:none}
@keyframes float{50%{transform:translateY(-14px) rotate(-2deg)}}
.say{position:fixed;inset:0;z-index:40;display:grid;place-items:center;background:rgba(11,9,9,.75);padding:16px;backdrop-filter:blur(5px)}
.saybox{text-align:center;width:min(1100px,92vw);animation:pop .4s both}
.saytext{font:900 72px/1.1 var(--font);letter-spacing:-.03em;margin:12px 0 26px;color:var(--blue)}

/* ---- finish: podium ---- */
.finwrap{display:grid;grid-template-columns:1.25fr 1fr;gap:50px;align-items:end;max-width:1700px;margin-inline:auto}
.podium{display:flex;justify-content:center;align-items:flex-end;gap:18px;height:620px}
.pcol{display:flex;flex-direction:column;align-items:center;width:270px}
.pem{font-size:96px;line-height:1;animation:bob 2.4s ease-in-out infinite}
.pname{font:900 34px var(--font);letter-spacing:-.02em;text-transform:uppercase;margin:4px 0 10px}
.pbar{width:100%;height:0;border-radius:22px 22px 0 0;background:linear-gradient(180deg,var(--c),color-mix(in srgb,var(--c) 45%,#000));display:flex;flex-direction:column;align-items:center;justify-content:flex-start;padding-top:14px;transition:height 1.3s cubic-bezier(.2,1.1,.3,1);overflow:hidden}
.pbar b{font-size:130px;line-height:1}
.pbar span{font:800 30px var(--font);color:var(--ink);background:rgba(255,255,255,.85);border-radius:99px;padding:4px 18px;margin-top:8px}
.board{display:grid;gap:10px}
.row{display:flex;align-items:center;gap:14px;background:rgba(255,255,255,.1);border:3px solid var(--c);border-radius:20px;padding:10px 20px;font-weight:800;font-size:32px}
.grow{flex:1}
.pm{width:50px;height:50px;border-radius:50%;border:2px solid rgba(255,255,255,.3);background:rgba(255,255,255,.1);color:#fff;font:800 28px var(--font);cursor:pointer}
.pts{min-width:2.2ch;text-align:center;font-weight:900}


/* ===== v4: nav compaction, setup tabs, modes, teams editor ===== */
.step{padding:9px 13px}
.step em{display:none;font-style:normal;margin-left:6px}
.step.on em{display:inline}
.tabs{display:flex;gap:10px;margin:6px 0 14px;justify-content:center}
.tabb{font:800 22px var(--font);padding:12px 26px;border-radius:99px;border:2px solid var(--line);background:var(--soft);color:var(--muted);cursor:pointer}
.tabb.on{background:var(--ink);border-color:var(--ink);color:#fff}
.modes{display:grid;grid-template-columns:repeat(5,1fr);gap:14px}
.mode{position:relative;text-align:left;border:3px solid var(--line);background:var(--soft);border-radius:20px;padding:14px 16px 12px;cursor:pointer;color:var(--ink);font-family:var(--font);display:flex;flex-direction:column;gap:2px;min-height:186px}
.mode .me{font-size:40px;line-height:1}
.mode b{font-size:24px;font-weight:800;margin-top:4px}
.mode i{font-style:normal;font-size:16px;font-weight:700;color:var(--muted)}
.mode p{margin:4px 0 0;font-size:16px;line-height:1.3;font-weight:500;color:var(--muted)}
.mode .tick{position:absolute;right:12px;top:12px;width:32px;height:32px;border-radius:50%;border:2px solid var(--line);display:grid;place-items:center;font-size:18px;color:transparent;background:#fff}
.mode.on{border-color:var(--blue);background:#eaf2ff}
.mode.on .tick{background:var(--blue);border-color:var(--blue);color:#fff}
.modebar{display:flex;align-items:center;gap:14px;margin-top:16px;font-size:22px;font-weight:700}
.modebar .grow{flex:1}
.warn{color:var(--bad)}
.nums4{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
.trows{display:grid;grid-template-columns:1fr 1fr;gap:12px 28px;margin-top:12px}
.trow{display:flex;align-items:center;gap:12px;background:var(--soft);border:3px solid var(--c);border-radius:18px;padding:10px 14px}
.tem{width:76px;height:76px;border-radius:16px;border:2px solid var(--line);background:#fff;font-size:46px;cursor:pointer;line-height:1;flex:none}
#setup .tname{flex:1;font:800 28px var(--font);min-width:0}
.tcol{width:48px;height:48px;border-radius:50%;border:4px solid #fff;box-shadow:0 0 0 2px var(--line);cursor:pointer;flex:none}
.emo{position:absolute;inset:0;z-index:48;display:grid;place-items:center;background:rgba(11,9,9,.7);backdrop-filter:blur(4px)}
.emobox{width:1100px;animation:pop .3s both}
.egrid{display:grid;grid-template-columns:repeat(10,1fr);gap:10px;margin:10px 0 16px}
.eb{font-size:50px;line-height:1;padding:10px 0;border-radius:16px;border:2px solid var(--line);background:var(--soft);cursor:pointer}
.eb:active{background:#eaf2ff;border-color:var(--blue)}
.btn.bad{background:var(--bad);box-shadow:0 10px 28px rgba(239,59,92,.45)}
.opt.good{background:#d9f7e8;border-color:var(--green)}
.opt.badc{background:#ffe0e7;border-color:var(--bad)}

/* taboo */
.tbwrap{display:flex;flex-direction:column;gap:16px;height:100%;justify-content:center}
.tbtop{display:flex;align-items:center;gap:26px;background:rgba(255,255,255,.1);border:3px solid var(--c);border-radius:22px;padding:12px 26px;backdrop-filter:blur(6px)}
.tbtop .who{font:900 44px/1 var(--font);letter-spacing:-.02em;text-transform:uppercase}
.tbtimer{font:900 84px/1 var(--font);margin-left:auto;min-width:130px;text-align:right}
.tbtimer.low{color:#ff5a6e;animation:pulse 1s infinite}
.tbsc{font:800 38px var(--font);display:flex;gap:26px}
.tabcard{text-align:center;padding:26px 40px 34px}
.tabword{font:900 150px/1 var(--font);letter-spacing:-.04em;color:var(--ink);margin:14px 0 22px;word-break:break-word}
.tabword.long{font-size:96px}
.forbid{display:flex;gap:14px;justify-content:center;align-items:center;flex-wrap:wrap;font-size:30px;font-weight:700;color:var(--muted)}
.forbid i{font-style:normal;background:#ffe0e7;color:var(--bad);border:3px solid var(--bad);border-radius:14px;padding:6px 22px;font-weight:900;font-size:42px;text-transform:uppercase}
.tabbtns{display:flex;gap:20px;justify-content:center;margin-top:30px}
.tabres{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;margin:14px 0}
.tabres i{font-style:normal;background:#d9f7e8;border:2px solid var(--green);color:#0a7a51;border-radius:12px;padding:6px 16px;font-weight:800;font-size:26px}

/* bee */
.beewrap{display:flex;flex-direction:column;gap:14px;height:100%}
.beecard{flex:1;min-height:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;text-align:center;padding:18px 30px}
.spk{display:flex;gap:22px;justify-content:center;align-items:center}
.spkbtn{width:150px;height:150px;border-radius:50%;border:0;background:var(--blue);color:#fff;font-size:70px;cursor:pointer;box-shadow:0 14px 40px rgba(0,103,227,.5);animation:pulse 2s infinite}
.spkbtn.sm{width:100px;height:100px;font-size:46px;background:var(--ink);animation:none;box-shadow:none}
.beedef{min-height:48px;font:600 30px/1.25 var(--font);color:var(--muted);max-width:1300px}
.beeslots{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
.bs2{width:70px;height:88px;border-radius:14px;border:3px solid var(--line);background:var(--soft);display:grid;place-items:center;font:900 50px var(--font);color:var(--ink)}
.bs2.f{border-color:var(--blue);background:#eaf2ff}
.bs2.ok{border-color:var(--green);background:#d9f7e8;color:#0a7a51}
.bs2.bad{border-color:var(--bad);background:#ffe0e7;color:#b71a3f}
.kb{display:flex;flex-direction:column;gap:9px;align-items:center;flex:none}
.kbrow{display:flex;gap:9px}
.kk{width:90px;height:78px;border-radius:14px;border:0;background:#fff;color:var(--ink);font:800 38px var(--font);text-transform:uppercase;cursor:pointer;box-shadow:0 5px 0 rgba(0,0,0,.3)}
.kk:active{transform:translateY(4px);box-shadow:0 1px 0 rgba(0,0,0,.3)}
.kk.wide{width:150px;font-size:30px}
.kk.go{background:var(--green);color:#fff}
.beemsg{min-height:50px;font:900 40px var(--font);letter-spacing:-.02em}

/* sentence race */
.sbline{min-height:120px;display:flex;flex-wrap:wrap;gap:8px;align-content:flex-start;padding:10px;border:3px dashed #c5cbe2;border-radius:16px;background:var(--soft)}
.sbpool{flex:1;display:flex;flex-wrap:wrap;gap:10px;justify-content:center;align-content:flex-start;padding-top:6px}
.chip2{font:800 30px var(--font);padding:10px 18px;border-radius:12px;border:0;background:var(--blue);color:#fff;box-shadow:0 4px 0 var(--blue-d);cursor:pointer}
.chip2.pl{background:#fff;color:var(--ink);border:3px solid var(--blue);box-shadow:none;padding:7px 15px}
.dense .chip2{font-size:22px;padding:6px 12px}
.dense .chip2.pl{padding:4px 10px}
.dense .sbline{min-height:86px}
.sbsen{font:800 46px/1.25 var(--font);letter-spacing:-.02em;margin:10px 0 18px}

/* map */
.mapwrap{display:flex;flex-direction:column;gap:12px;height:100%}
.mapgrid{flex:1;min-height:0;display:grid;gap:12px}
.mc{position:relative;border:3px solid rgba(255,255,255,.2);border-radius:20px;background:rgba(255,255,255,.1);color:#fff;cursor:default;display:flex;flex-direction:column;align-items:center;justify-content:center;font-family:var(--font);padding:0;min-height:0}
.mc .me{font-size:62px;line-height:1}
.mc.small .me{font-size:40px}
.mc .star{position:absolute;right:10px;top:6px;font-size:24px;font-weight:900;color:var(--gold)}
.mc .hm{position:absolute;left:10px;top:6px;font-size:22px}
.mc.owned{background:color-mix(in srgb,var(--c) 38%,#0b0909);border-color:var(--c)}
.mc.allowed{cursor:pointer;border-color:#fff;animation:glow 1.2s infinite;background:rgba(255,255,255,.22)}
@keyframes glow{50%{box-shadow:0 0 0 7px rgba(255,255,255,.35)}}
.mq{position:absolute;inset:0;z-index:46;display:grid;place-items:center;background:rgba(11,9,9,.74);backdrop-filter:blur(4px)}
.mqbox{width:1300px;animation:pop .3s both}
.mqtop{display:flex;align-items:center;gap:20px;margin-bottom:6px;font-weight:800;font-size:28px}
.mqtop .tbar{flex:1;height:14px;border-radius:99px;background:var(--line);overflow:hidden}
.mqtop .tbar i{display:block;height:100%;width:100%;background:linear-gradient(90deg,var(--blue),var(--hot));transition:width .2s linear}
.mapend{display:grid;grid-template-columns:1.3fr 1fr;gap:40px;align-items:center}

/* tug of war */
.tugwrap{display:flex;flex-direction:column;gap:14px;height:100%}
.tugtxt{font:800 50px/1.2 var(--font);letter-spacing:-.02em}
.tugtxt b{color:var(--blue)}
.tugscene{position:relative;flex:none;height:250px;background:linear-gradient(#17172a 0 74%,#0f0f1c 74%);border:2px solid rgba(255,255,255,.18);border-radius:26px;overflow:hidden}
.pit{position:absolute;top:0;bottom:0;width:12%}
.mid{position:absolute;left:50%;top:0;bottom:0;width:4px;background:rgba(255,255,255,.3)}
.rope{position:absolute;left:3%;right:3%;top:150px;height:14px;border-radius:99px;background:repeating-linear-gradient(90deg,#c8964a 0 22px,#a87632 22px 44px)}
.flag{position:absolute;top:92px;font-size:70px;line-height:1;transform:translateX(-50%);transition:left .6s cubic-bezier(.3,1.3,.5,1)}
.tchar{position:absolute;top:70px;font-size:120px;line-height:1;transition:transform .6s cubic-bezier(.3,1.3,.5,1)}
.tugbtns{flex:1;min-height:0;display:grid;grid-template-columns:1fr 1fr;gap:24px}
.tgb{border:4px solid var(--c);border-radius:26px;background:rgba(255,255,255,.08);padding:14px 18px;display:flex;flex-direction:column;gap:10px;min-height:0}
.tgb h3{margin:0;font:900 36px var(--font);text-transform:uppercase;letter-spacing:-.01em}
.tgb .two{flex:1;min-height:0;display:grid;grid-template-columns:1fr 1fr;gap:14px}
.tf{border:0;border-radius:20px;font:900 52px var(--font);cursor:pointer;letter-spacing:.02em}
.tf.t{background:var(--green);color:#fff}
.tf.f{background:var(--bad);color:#fff}
.tf:disabled{opacity:.35;cursor:default}


/* ===== v5: vocabulary mode ===== */
.modes{grid-template-columns:repeat(6,1fr)}
.mode{min-height:178px}
.mode p{font-size:15px}
.fcards{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;margin-top:6px}
.fc{perspective:900px;height:var(--rh);background:none;border:0;padding:0;cursor:pointer}
.fi{position:relative;display:block;width:100%;height:100%;transition:transform .6s;transform-style:preserve-3d}
.fc.flip .fi{transform:rotateY(180deg)}
.ff,.fb{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;border-radius:22px;display:grid;place-items:center;padding:12px;text-align:center;font:900 46px/1.1 var(--font);letter-spacing:-.02em;word-break:break-word}
.ff{background:#fff;color:var(--ink);box-shadow:0 14px 36px rgba(0,0,0,.35)}
.fb{background:linear-gradient(135deg,var(--blue),#6c5cff);color:#fff;transform:rotateY(180deg);box-shadow:0 14px 36px rgba(0,103,227,.5)}
.vword{flex:none;text-align:center;padding:12px 30px 14px}
.vlabel{font-weight:700;color:var(--blue);font-size:22px;text-transform:uppercase;letter-spacing:.08em}
.vbig{display:flex;align-items:center;justify-content:center;gap:24px;font:900 92px/1.05 var(--font);letter-spacing:-.03em;margin-top:2px}
.vbig .spkbtn{width:84px;height:84px;font-size:40px;animation:none}
.vreveal{min-height:38px;font:800 32px var(--font);color:var(--green)}
.vopts{flex:1;min-height:0;grid-auto-rows:1fr}
.vopts .opt{font-size:40px;font-weight:800}
.vopts .opt.long{font-size:30px}
.dense .vopts .opt{font-size:30px}
.dense .vopts .opt.long{font-size:23px}
.vcd .vbig{font-size:64px}
.vcd .vreveal{min-height:30px;font-size:26px}


/* ===== v6: per-mode content editor, match-style vocabulary ===== */
.mcols.eq{grid-template-columns:1fr 1fr;gap:60px}
.mt.k{font-weight:800;font-size:32px}
.cxbar{display:flex;align-items:flex-start;gap:14px;margin:8px 0 2px}
.cxt{font-weight:800;font-size:20px;color:var(--muted);padding-top:10px;white-space:nowrap}
.cxchips{display:flex;flex-wrap:wrap;gap:8px}
.cxb{border:3px solid var(--line);background:var(--soft);border-radius:99px;padding:8px 18px;font:800 20px var(--font);color:var(--ink);cursor:pointer}
.cxb u{text-decoration:none;color:var(--green);font-size:14px;margin-left:4px}
.cxb.on{border-color:var(--blue);background:#eaf2ff}
.cxhead{display:flex;align-items:flex-start;gap:16px;margin:6px 0 2px}

.cxfields{display:grid;gap:24px}
.cxfields.cf2{grid-template-columns:1fr 1fr}
.cxpane[hidden]{display:none}


.turn .who{white-space:nowrap;flex:none}
.turn .msg{flex:1;min-width:0}
.cxb{padding:6px 14px;font-size:18px}

/* ===== v7: more modes, report, lessons ===== */
#nav{flex:1 1 auto;min-width:0;overflow-x:auto;scrollbar-width:none}
#nav::-webkit-scrollbar{display:none}
.step{flex:none}
#score{margin-left:0}
.modes{gap:12px}
.mode{min-height:172px;padding:12px 14px 10px}
.mode p{font-size:14px}
.mode b{font-size:22px}
.nums4{grid-template-columns:repeat(5,1fr)}
.cxb{padding:5px 12px;font-size:17px}
.passage{flex:none;padding:12px 22px;font:600 28px/1.35 var(--font);text-align:left;color:var(--ink)}
.passage .sen{border-radius:8px;transition:background .3s}
.passage .sen.hl{background:#fff1a8;box-shadow:0 0 0 4px #fff1a8}
.vcd .passage{font-size:22px;padding:8px 18px}
.vbig.q{font-size:54px}
.vcd .vbig.q{font-size:40px}
.tokrow{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;align-content:center;flex:1;padding:6px}

const BASIC_MODES = ['teams', 'escape', 'match', 'smash', 'reflect'];

const EX_WORDS = [

  'renewable = able to be replaced naturally, like wind or solar energy | жаңартылатын',

  'habitat = the natural home of an animal or plant | мекендеу ортасы',

  teams: 3, students: 12, minutes: 12, tabooSec: 60, speakSec: 30, lang: 'en', modes: BASIC_MODES.slice(), teamCfg: DEF_TEAMS.map(t => ({ e: t.e, n: t.n, c: t.c })), setupTab: 0, cx: defCx(), cxSel: 'shared', pool: null,
  stage: 'setup', last: 'teams', started: false, reactions: 0,
  words: [], scores: [], cards: [], revealed: [], esc: null, m: null, sm: null, ref: null, tb: null, bee: null, sb: null, map: null, tug: null, vc: null, bank: [], log: {}, mark: null, rc: {}, sp: null, sy: null
};
const SAVE_KEYS = ['topic', 'grade', 'wordsText', 'questionsText', 'sentencesText', 'promptsText', 'teams', 'students', 'minutes', 'tabooSec', 'modes', 'teamCfg', 'cx', 'speakSec', 'lang'];

/* ================= particles ================= */
const fx = $('#fx'); const fctx = fx.getContext ? fx.getContext('2d') : null;
let PT = [], raf = 0;
function sizeFx() { if (!fctx) return; fx.width = Math.round(innerWidth * dpr); fx.height = Math.round(innerHeight * dpr); fctx.setTransform(dpr, 0, 0, dpr, 0, 0); }

function burst(x, y, n = 40, colors = COLORS, power = 8) {
  if (!fctx) return; if (reduce) n = Math.ceil(n / 3);
  for (let i = 0; i < n; i++) {
    const a = Math.random() * 6.283, v = (Math.random() * .7 + .3) * power;
    PT.push({ x, y, vx: Math.cos(a) * v, vy: Math.sin(a) * v - 2, life: 1, d: .012 + Math.random() * .012, s: 5 + Math.random() * 7, c: colors[i % colors.length], g: .22 });

const Aud = {

  load() { try { const j = JSON.parse(localStorage.getItem('english_mission_audio') || 'null'); if (j) { this.musOn = j.mo !== false; this.sfxOn = j.so !== false; this.musVol = j.mv != null ? j.mv : this.musVol; this.sfxVol = j.sv != null ? j.sv : this.sfxVol; } } catch (_) {} }
};
Aud.load();

/* ================= 9. CONQUER THE MAP ================= */
const MAP_Q_MS = 25000;
function newMap() {
  const T = S.teams; const W = S.pool.mapW.filter(w => w.h);
  const cust = shuffle(S.pool.mapQ.slice()).map(q => ({ type: 'mc', label: 'Choose the correct answer', main: q.q, options: shuffle([q.a].concat(q.wrong)), answer: q.a, key: 'q:' + q.q }));

  [/^It is a <em>(tie|draw)!<\/em>$/, m => 'Ничья <em>!</em>', m => 'Тең <em>ойын!</em>'],
  [/^(.*)Scratch a card with your finger to see your team$/, m => m[1] + 'Сотри слой пальцем, чтобы узнать свою команду', m => m[1] + 'Командаңды білу үшін картаны саусағыңмен тырна'],
  [/^(\d+) points$/, m => m[1] + ' ' + plRu(+m[1], 'балл', 'балла', 'баллов'), m => m[1] + ' ұпай'],

  [/^Plays left: (\d+)$/, m => 'Осталось прослушиваний: ' + m[1], m => 'Қалған тыңдау: ' + m[1]],

  [/^Use the word “(.*)” in your sentence!$/, m => 'Используйте слово «' + m[1] + '» в предложении!', m => 'Сөйлемде «' + m[1] + '» сөзін қолданыңдар!'],
  [/^🔇 No audio on this device\. Read the text aloud: (.*)$/, m => '🔇 На этом устройстве нет звука. Прочитайте текст вслух: ' + m[1], m => '🔇 Бұл құрылғыда дыбыс жоқ. Мәтінді дауыстап оқыңдар: ' + m[1]],
  [/^⏭ Skip \((\d+)\)$/, m => '⏭ Пропустить (' + m[1] + ')', m => '⏭ Өткізу (' + m[1] + ')'],
  [/^⏱ (\d+) seconds per turn\. Every crew plays one turn\.$/, m => '⏱ ' + m[1] + ' секунд на ход. Каждая команда играет один раз.', m => '⏱ Кезегіне ' + m[1] + ' секунд. Әр команда бір рет ойнайды.'],
  [/^⏱ (\d+) seconds per word\. Crews take turns\.$/, m => '⏱ ' + m[1] + ' секунд на слово. Команды ходят по очереди.', m => '⏱ Әр сөзге ' + m[1] + ' секунд. Командалар кезекпен жүреді.'],
  [/^⏱ (\d+) seconds per round · (\d+) rounds\.$/, m => '⏱ ' + m[1] + ' секунд на раунд · раундов: ' + m[2] + '.', m => '⏱ Әр раундқа ' + m[1] + ' секунд · раунд саны: ' + m[2] + '.'],
  [/^⏱ You have (\d+) seconds\. The helper words are optional\.$/, m => '⏱ У вас ' + m[1] + ' секунд. Слова-помощники по желанию.', m => '⏱ Сендерде ' + m[1] + ' секунд бар. Көмекші сөздерді қолдану міндетті емес.'],
  [/^One speaker, one topic, (\d+) seconds$/, m => 'Один выступающий, одна тема, ' + m[1] + ' секунд', m => 'Бір оқушы, бір тақырып, ' + m[1] + ' секунд'],
  [/^⌨️ Type on the screen keyboard\. You have (\d+) seconds\.$/, m => '⌨️ Набирайте на экранной клавиатуре. У вас ' + m[1] + ' секунд.', m => '⌨️ Экрандағы пернетақтада теріңдер. Сендерде ' + m[1] + ' секунд бар.'],
  [/^⭐ A good sentence = \+(\d+) points, a long one \((\d+)\+ words\) = \+(\d+)\.$/, m => '⭐ Хорошее предложение = +' + m[1] + ' балла, длинное (' + m[2] + '+ слов) = +' + m[3] + '.', m => '⭐ Жақсы сөйлем = +' + m[1] + ' ұпай, ұзын сөйлем (' + m[2] + '+ сөз) = +' + m[3] + '.'],
  [/^(\d)st \+(\d+) · (\d)nd \+(\d+) · others \+(\d+)$/, m => '1-е +' + m[2] + ' · 2-е +' + m[4] + ' · остальные +' + m[5], m => '1-орын +' + m[2] + ' · 2-орын +' + m[4] + ' · қалғандары +' + m[5]],
  [/^Tap the words in the right order · (\d)st \+(\d+) · (\d)nd \+(\d+) · others \+(\d+)$/, m => 'Нажимайте на слова в правильном порядке · 1-е +' + m[2] + ' · 2-е +' + m[4] + ' · остальные +' + m[5], m => 'Сөздерді дұрыс ретпен басыңдар · 1-орын +' + m[2] + ' · 2-орын +' + m[4] + ' · қалғандары +' + m[5]],
  [/^🏁 First correct (answer|tap|word) \+(\d+), second \+(\d+), others \+(\d+)\. A wrong (tap|word) locks your crew for (\d+) seconds\.$/, m => '🏁 Первый верный ответ +' + m[2] + ', второй +' + m[3] + ', остальные +' + m[4] + '. Неверный ответ блокирует команду на ' + m[6] + ' секунды.', m => '🏁 Бірінші дұрыс жауап +' + m[2] + ', екінші +' + m[3] + ', қалғандары +' + m[4] + '. Қате жауап команданы ' + m[6] + ' секундқа бұғаттайды.'],
  [/^🏁 First crew with the right sentence gets \+(\d+), second \+(\d+), others \+(\d+)\.$/, m => '🏁 Первая команда с верным предложением получает +' + m[1] + ', вторая +' + m[2] + ', остальные +' + m[3] + '.', m => '🏁 Дұрыс сөйлемді бірінші құраған команда +' + m[1] + ', екінші +' + m[2] + ', қалғандары +' + m[3] + ' алады.'],
  [/^❌ A wrong sentence locks your crew for (\d+) seconds\.$/, m => '❌ Неверное предложение блокирует команду на ' + m[1] + ' секунды.', m => '❌ Қате сөйлем команданы ' + m[1] + ' секундқа бұғаттайды.'],
  [/^🎯 Crews take turns\. A right pair = \+(\d+) and you go on, a wrong pair passes the turn\.$/, m => '🎯 Команды ходят по очереди. Верная пара = +' + m[1] + ', и вы продолжаете; неверная передаёт ход.', m => '🎯 Командалар кезекпен жүреді. Дұрыс жұп = +' + m[1] + ', сіз жалғастырасыз; қате жұп кезекті береді.'],
  [/^🔥 Three right pairs in a row = \+(\d+) bonus point\.$/, m => '🔥 Три верные пары подряд = +' + m[1] + ' бонусный балл.', m => '🔥 Қатарынан үш дұрыс жұп = +' + m[1] + ' бонус ұпай.'],
  [/^Every crew has its OWN (\d+) tasks\. First to the door wins… if the code is right!$/, m => 'У каждой команды СВОИ ' + m[1] + ' заданий. Первым к двери — побеждает… если код верный!', m => 'Әр команданың ӨЗ ' + m[1] + ' тапсырмасы бар. Есікке бірінші жеткен жеңеді… егер код дұрыс болса!'],
  [/^★ Star cells are worth 2 points\. Each crew has (\d+) turns\.$/, m => '★ Клетки со звездой стоят 2 балла. У каждой команды ' + m[1] + ' ходов.', m => '★ Жұлдызды ұяшық 2 ұпай тұрады. Әр команданың ' + m[1] + ' жүрісі бар.'],
  [/^(\S+) (\d+) cells · (\d+) turns$/, m => m[1] + ' клеток: ' + m[2] + ' · ходов: ' + m[3], m => m[1] + ' ұяшық: ' + m[2] + ' · жүріс: ' + m[3]],
  [/^(\S+): (\d+) guessed, (\d+) buzz$/, m => m[1] + ': угадано ' + m[2] + ', buzz ' + m[3], m => m[1] + ': тапты ' + m[2] + ', buzz ' + m[3]],
  [/^⚔️ Attack (.+)$/, m => '⚔️ Атака: ' + m[1], m => '⚔️ Шабуыл: ' + m[1]],
  [/^(✅|❌) (Right|Wrong)! (.+) pulls(.*)$/, m => (m[2] === 'Right' ? '✅ Верно! ' : '❌ Неверно! ') + m[3] + ' тянет' + m[4].replace(' · real meaning:', ' · на самом деле:').replace(' · real:', ' · на самом деле:'), m => (m[2] === 'Right' ? '✅ Дұрыс! ' : '❌ Қате! ') + m[3] + ' тартады' + m[4].replace(' · real meaning:', ' · шын мәнінде:').replace(' · real:', ' · шын мәнінде:')],
  [/^<b id="rcount">(.*)<\/b> Reactions$/, m => '<b id="rcount">' + m[1] + '</b> Реакций', m => '<b id="rcount">' + m[1] + '</b> Реакция']
];
function trLookup(key) {
  if (Object.prototype.hasOwnProperty.call(I18N, key)) return I18N[key];
  for (const r of I18N_RE) { const m = key.match(r[0]); if (m) return { ru: r[1](m), kk: r[2](m) }; }
  return null;
}
const TR_INL = new Set(['EM', 'B', 'I', 'SPAN', 'U', 'BR', 'STRONG', 'SMALL']);
const TR_SKIP = new Set(['SCRIPT', 'STYLE', 'TEXTAREA', 'INPUT', 'CANVAS', 'SELECT', 'OPTION']);
function trEl(el) {
  const L = S.lang; const cur = el.innerHTML; let key;
  if (el.__tr !== undefined && cur === el.__tr) { if (el.__lang === L) return; key = el.__en; }
  else { if (L === 'en') return; key = cur.trim(); }
  const hit = trLookup(key); if (!hit) { el.__tr = undefined; el.__en = undefined; el.__lang = undefined; return; }
  const out = L === 'en' ? key : (hit[L] || key);
  el.innerHTML = out; el.__en = key; el.__tr = el.innerHTML; el.__lang = L;
}
function trTree(root) {
  if (!root || !root.querySelectorAll) return;
  root.querySelectorAll('*').forEach(el => {
    if (TR_SKIP.has(el.tagName) || el.children.length > 4) return;
    for (const c of el.children) if (!TR_INL.has(c.tagName)) return;
    const t = el.textContent; if (!t || !t.trim() || t.length > 320) return;
    trEl(el);
  });
}
let trQ = false;
function trSchedule() { if (S.lang === 'en' || trQ) return; trQ = true; requestAnimationFrame(() => { trQ = false; trTree(document.body); }); }
function setLang(l) { S.lang = l; persist(); renderBar(); trTree(document.body); }
new MutationObserver(trSchedule).observe(document.body, { childList: true, subtree: true, characterData: true });

/* ================= events ================= */
document.addEventListener('click', e => {
  Aud.wake();
  const pop_ = $('#audpop'); if (pop_ && !pop_.hidden && !e.target.closest('#audpop') && !e.target.closest('[data-do="aud"]')) pop_.hidden = true;
  const el = e.target.closest('[data-do]'); if (!el) return; const d = el.dataset;
  switch (d.do) {
    case 'go': sfx.tap(); go(d.go); break;
    case 'aud': { const p = $('#audpop'); p.hidden = !p.hidden; syncAudUI(); sfx.tap(); break; }
    case 'musT': Aud.musOn = !Aud.musOn; Aud.apply(); Aud.save(); syncAudUI(); renderBar(); break;
    case 'sfxT': Aud.sfxOn = !Aud.sfxOn; Aud.apply(); Aud.save(); syncAudUI(); renderBar(); if (Aud.sfxOn) sfx.ok(); break;
    case 'react': react(d.e, el); break;
    case 'full': toggleFull(); break;
    case 'setup': go('setup'); break;
    case 'start': startMission(); break;
    case 'example': fillExample(); break;
    case 'gen': generate(); break;
    case 'back': go(S.last || 'teams'); break;
    case 'shuffle': assignCards(); SCREENS.teams(); sfx.whoosh(); break;
    case 'revealall': revealAll(); break;
    case 'estart': escStart(); break;
    case 'endnow': endNow(); break;
    case 'ans': escAnswer(+d.t, d.a); break;
    case 'tile': escTile(+d.t, +d.i); break;
    case 'slot': escSlot(+d.t, +d.s); break;
    case 'lock': escLock(+d.t); break;
    case 'freeze': freezeOpen(+d.t); break;
    case 'freezeTo': freezeTo(+d.t, +d.x); break;
    case 'freezeCancel': { const p = $('#qk' + d.t); if (p) p.hidden = true; break; }
    case 'doors': doorsStart(); break;
    case 'dnext': doorNext(); break;
    case 'mpick': if (Date.now() - lastDrag < 350) break; matchPick(d.side, +d.i); break;
    case 'pick': smashPickTeam(el); break;
    case 'launch': smashStart(); break;
    case 'swat': swat(el); break;
    case 'speak': { const sm = S.sm; if (sm && sm.cur) { try { const u = new SpeechSynthesisUtterance(sm.cur.h); u.lang = 'en-US'; u.rate = .85; speechSynthesis.cancel(); speechSynthesis.speak(u); } catch (_) {} } break; }
    case 'again': S.sm.phase = 'pick'; SCREENS.smash(); syncMusic(); break;
    case 'pop': pop(el); break;
    case 'sayok': closeSay(); break;
    case 'refill': S.ref = null; SCREENS.reflect(); sfx.whoosh(); break;
    case 'pm': scoreAdj(el); break;
    case 'tab': S.setupTab = +d.i; $$('.pane').forEach(p => { p.hidden = +p.dataset.pane !== S.setupTab; }); $$('.tabb').forEach((b, i) => b.classList.toggle('on', i === S.setupTab)); sfx.tap(); break;
    case 'modeT': modeToggle(d.m); break;
    case 'modeAll': S.modes = MODE_ORDER.slice(); sfx.tap(); refreshModes(); break;
    case 'modeBasic': S.modes = BASIC_MODES.slice(); sfx.tap(); refreshModes(); break;
    case 'emo': openEmo(+d.i); break;
    case 'emoPick': pickEmo(+d.i, d.e); break;
    case 'emoClose': closeEmo(); break;
    case 'tcol': cycleCol(+d.i); break;
    case 'tbStart': S.tb.phase = 'ready'; SCREENS.taboo(); sfx.whoosh(); break;
    case 'tbGo': tabGo(); break;
    case 'tbGot': tabAct('got'); break;
    case 'tbBuzz': tabAct('buzz'); break;
    case 'tbSkip': tabAct('skip'); break;
    case 'tbNext': { const tb = S.tb; tb.turn++; tb.phase = tb.turn >= tb.order.length ? 'end' : 'ready'; SCREENS.taboo(); sfx.whoosh(); break; }
    case 'tbAgain': { const tb = S.tb; tb.turn = 0; tb.order = shuffle(Array.from({ length: S.teams }, (_, i) => i)); tb.phase = 'ready'; SCREENS.taboo(); sfx.whoosh(); break; }
    case 'beeStart': beeStartItem(); break;
    case 'beeSay': beeSay(false); break;
    case 'beeSlow': beeSay(true); break;
    case 'beeDef': beeDefShow(false); break;
    case 'bkey': beeKey(d.k); break;
    case 'sbStart': sbStart(); break;
    case 'sbTile': sbTile(+d.t, +d.i); break;
    case 'sbUn': sbUn(+d.t, +d.p); break;
    case 'sbNext': sbNext(); break;
    case 'mapStart': mapStart(); break;
    case 'mcell': mapAsk(+d.i); break;
    case 'mans': mapAnswer(d.a, el); break;
    case 'tpick': tugPickTeam(el); break;
    case 'tlaunch': tugStart(); break;
    case 'tans': tugAnswer(d.side, d.v); break;
    case 'tagain': S.tug.phase = 'pick'; S.tug.pos = 0; SCREENS.tug(); syncMusic(); break;
    case 'translate': translateWords(); break;
    case 'cxSel': S.cxSel = d.k; cxChips(); sfx.tap(); break;
    case 'cxEx': cxExample(d.k); break;
    case 'cxClear': cxClear(d.k); break;
    case 'vstart': S.vc.phase = 'learn'; vcLearn(); sfx.whoosh(); break;
    case 'vflip': vcFlip(+d.i); break;
    case 'vplay': vcPlay(); break;
    case 'vagain': S.vc = newVc(); SCREENS.vocab(); sfx.whoosh(); syncMusic(); break;
    case 'rcStart': rcStart(d.k); break;
    case 'rcPlay': rcPlay(d.k); break;
    case 'rcGo': rcGo(d.k); break;
    case 'rans': rcAnswer(d.k, +d.t, d.a); break;
    case 'rtile': rcTile(d.k, +d.t, +d.i); break;
    case 'rundo': rcUndo(d.k, +d.t, +d.p); break;
    case 'spStart': S.sp.phase = 'ready'; SCREENS.speak(); sfx.whoosh(); break;
    case 'spGo': spGo(); break;
    case 'spStop': spStop(); break;
    case 'spScore': spScore(+d.v); break;
    case 'spAgain': S.sp = newSp(); S.sp.phase = 'ready'; SCREENS.speak(); sfx.whoosh(); break;
    case 'syStart': syStart(); break;
    case 'skey': syKey(d.k); break;
    case 'syRead': { const sy = S.sy; speakText([sy.starter].concat(sy.story.map(x => x.text)).join(' '), .85); break; }
    case 'syAgain': S.sy = newSy(); SCREENS.story(); sfx.whoosh(); break;
    case 'lsSave': lsSave(); break;
    case 'lsOpen': lsOpen(); break;
    case 'lsDel': lsDel(); break;
    case 'lsExport': lsExport(); break;
    case 'lsImport': lsImport(); break;
    case 'repOpen': S.repView = 'report'; go('report'); break;
    case 'repView': S.repView = d.v; SCREENS.report(); sfx.tap(); break;
    case 'repDl': repDownload(); break;
    case 'repPrint': repPrint(); break;
    case 'lang': setLang(S.lang === 'en' ? 'ru' : S.lang === 'ru' ? 'kk' : 'en'); sfx.tap(); break;
    case 'replay': restart(); break;
  }
});
document.addEventListener('input', e => {
  const tg = e.target;
  if (tg.classList && tg.classList.contains('tname')) { const i = +tg.dataset.i; S.teamCfg[i].n = tg.value.replace(/[<>&"'`]/g, '').slice(0, 14) || DEF_TEAMS[i].n; }
  if (tg.id === 'f_teams') { const v = parseInt(tg.value, 10); if (v >= 2 && v <= 6) renderTeamRows(); }
  if (tg.closest && tg.closest('.cxfields')) cxChips();
  if (tg.id === 'emoInp') { const g = firstGrapheme(tg.value.trim()); if (g) pickEmo(+tg.dataset.i, g); }
  if (e.target.id === 'rMus') { Aud.musVol = e.target.value / 100; Aud.apply(); Aud.save(); }
  if (e.target.id === 'rSfx') { Aud.sfxVol = e.target.value / 100; Aud.apply(); Aud.save(); }
});
document.addEventListener('change', e => { if (e.target.id === 'rSfx') sfx.ok(); });
document.addEventListener('keydown', e => { if ((e.key === 'Enter' || e.key === ' ') && e.target.classList && e.target.classList.contains('mt')) { e.preventDefault(); matchPick(e.target.dataset.side, +e.target.dataset.i); } });

document.addEventListener('keydown', e => {
  if (S.stage !== 'bee' || !S.bee || S.bee.phase !== 'play' || S.bee.state !== 'q') return;
  if (e.target && e.target.closest && e.target.closest('input,textarea')) return;
  if (/^[a-zA-Z]$/.test(e.key)) beeKey(e.key.toLowerCase()); else if (e.key === 'Backspace') beeKey('del'); else if (e.key === 'Enter') beeKey('ok');
});

document.addEventListener('keydown', e => {
  if (S.stage !== 'story' || !S.sy || S.sy.phase !== 'turn') return;
  if (e.target && e.target.closest && e.target.closest('input,textarea')) return;
  if (e.key === 'Backspace') syKey('del'); else if (e.key === 'Enter') syKey('ok'); else if (e.key === ' ') { e.preventDefault(); syKey('space'); } else if (e.key.length === 1 && /[a-zA-Z,.?!']/.test(e.key)) syKey(e.key.toLowerCase());
});

renderBar(); SCREENS.setup(); fit(); syncAudUI(); if (S.lang !== 'en') trTree(document.body);
if (document.fonts && document.fonts.ready) document.fonts.ready.then(fit);
})();
</script>
